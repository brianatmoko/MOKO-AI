name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint with flake8
        run: |
          flake8 moko_core/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 moko_core/ --count --max-complexity=15 --max-line-length=120 --statistics
        continue-on-error: true

  import-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          python -m py_compile moko_core/moko_os.py
          python -m py_compile moko_core/moko_config/settings.py

  build-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ syntax
        run: |
          which g++ && g++ --version || echo "g++ not available"
          cd moko_ide_cpp && g++ -std=c++17 -fsyntax-only main.cpp 2>/dev/null && echo "C++ OK" || echo "C++ check skipped (needs Qt6)"

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check Rust
        run: |
          cd moko_core/moko_rust_core && cargo check 2>/dev/null && echo "Rust OK" || echo "Rust check skipped"
        continue-on-error: true
